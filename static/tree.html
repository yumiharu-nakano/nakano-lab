function makeNode(n){
  const li = document.createElement('li');
  li.className = 'node';
  const hasKids = n.c && n.c.length;
  let links = '';
  if(n.links) links = n.links.map(l => l[1]
      ? `<a class="tag" href="${l[1]}" target="_blank">${l[0]} ↗</a>`
      : `<span class="tag">${l[0]}</span>`).join('');
  const feeds = n.feeds ? `<span class="feeds">→ 統合へ</span>` : '';
  const cardCls = 'card e-'+n.era + (n.trunk?' trunk':'') + (n.canopy?' canopy':'');
  li.innerHTML = `
    <div class="row">
      <div class="toggle ${hasKids?'':'empty'}">${hasKids?'−':''}</div>
      <div class="${cardCls}">
        <p class="ttl">${n.t}<span class="yr">${n.y||''}</span>${feeds}</p>
        <p class="desc">${n.d||''}</p>
        <div class="tags">${roleTag(n.role)}${links}</div>
      </div>
    </div>`;
  if(hasKids){
    const ul = document.createElement('ul');
    n.c.forEach(ch => ul.appendChild(makeNode(ch)));
    li.appendChild(ul);
    const tg = li.querySelector('.toggle');
    tg.addEventListener('click', e=>{
      e.stopPropagation();
      li.classList.toggle('collapsed');
      tg.textContent = li.classList.contains('collapsed') ? '+' : '−';
    });
  }
  // hide empty tag rows
  if(!n.role && !n.links){ li.querySelector('.tags').style.display='none'; }
  return li;
}

tree.appendChild(makeNode(T));

const THEME_KEY = 'theme-001';
const themeBtn = document.getElementById('themeToggle');
const sysDark = window.matchMedia('(prefers-color-scheme: dark)');
function storedTheme(){
  try{ const v = localStorage.getItem(THEME_KEY); return (v==='light'||v==='dark') ? v : null; }
  catch(e){ return null; }
}
function applyTheme(choice){
  const root = document.documentElement;
  if(choice) root.setAttribute('data-theme', choice); else root.removeAttribute('data-theme');
  const dark = (choice || (sysDark.matches ? 'dark' : 'light')) === 'dark';
  themeBtn.textContent = dark ? '☀︎ ライト' : '☾ ダーク';
  themeBtn.setAttribute('aria-label', dark ? 'ライトモードに切り替え' : 'ダークモードに切り替え');
}
themeBtn.addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme') || (sysDark.matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  applyTheme(next);
});
sysDark.addEventListener('change', ()=>applyTheme(storedTheme()));
window.addEventListener('storage', e=>{ if(e.key===THEME_KEY) applyTheme(storedTheme()); });
applyTheme(storedTheme());

document.getElementById('expandAll').onclick = ()=>{
  document.querySelectorAll('li.node').forEach(li=>{
    li.classList.remove('collapsed');
    const t=li.querySelector(':scope > .row > .toggle');
    if(t && !t.classList.contains('empty')) t.textContent='−';
  });
};
document.getElementById('collapseAll').onclick = ()=>{
  // collapse everything except the very root, so only trunks show
  document.querySelectorAll('li.node').forEach(li=>{
    const card = li.querySelector(':scope > .row > .card');
    const isRoot = card && card.classList.contains('trunk') && li.parentElement.classList.contains('tree');
    if(!isRoot){
      li.classList.add('collapsed');
      const t=li.querySelector(':scope > .row > .toggle');
      if(t && !t.classList.contains('empty')) t.textContent='+';
    }
  });
  // keep root open
  const rootLi = document.querySelector('ul.tree > li.node');
  rootLi.classList.remove('collapsed');
  rootLi.querySelector(':scope > .row > .toggle').textContent='−';
};
</script>
